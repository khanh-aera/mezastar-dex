<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0714">
<title>MEZASTAR PLAY · Khanh</title>
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" href="../icons/favicon-32.png">
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="play.css">
</head>
<body class="playbody">

<header class="playhead">
  <div class="playbrand"><span class="pbolt"></span><span>MEZASTAR<em>PLAY</em></span></div>
  <a class="playback" href="../">◀ Binder</a>
</header>

<nav class="playtabs" id="playTabs">
  <button data-play="battle" class="on">⚔️ Battle</button>
  <button data-play="roster">🎒 My roster</button>
</nav>

<main class="playmain">

  <!-- ============ BATTLE ============ -->
  <section class="playpanel on" id="pp-battle">
    <div class="playhint">
      <b>1.</b> tap the 3 enemy tags you see on the machine &nbsp;→&nbsp; <b>2.</b> get the best 3 tags to send.
    </div>
    <div class="battlefoes" id="battleFoes"></div>
    <div id="battleBox"><div class="empty">Loading tag data…</div></div>
  </section>

  <!-- ============ ROSTER ============ -->
  <section class="playpanel" id="pp-roster">
    <div id="rosterList"></div>
  </section>

</main>

<footer class="playfoot">
  <span>damage reads <b>Atk</b> for physical moves, <b>Sp.ATK</b> for special.</span>
  <span>PE is an energy scale, not damage.</span>
  <span>numbers are estimates — the cabinet is the calibration.</span>
</footer>

<!-- the enemy picker opens in the binder's modal + scrim; play reuses them verbatim -->
<div class="scrim" id="scrim"></div>
<div class="modal" id="modal"></div>

<script src="app.js"></script>
</body>
</html>
