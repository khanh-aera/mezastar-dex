<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1a2b">
<title>Pokédex — Khanh's Collection</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

<!-- ============ COLLECTION VIEW ============ -->
<section id="view-grid" class="view active">
  <header class="titlebar">
    <h1>POKÉ<span>DEX</span></h1>
    <div class="count" id="count"></div>
  </header>
  <div id="filters">
    <button class="filter active" data-f="all">All</button>
    <button class="filter" data-f="main">🏆 Main</button>
    <button class="filter" data-f="star">⭐ Star</button>
    <button class="filter" data-f="power">⚡ Power</button>
  </div>
  <div id="grid"></div>
</section>

<!-- ============ BATTLE VIEW ============ -->
<section id="view-battle" class="view">
  <header class="titlebar"><h1>⚔️<span>BATTLE</span></h1></header>
  <p class="sub">Enemy's 3 Pokémon → your best 3 counters</p>
  <div id="enemy-slots">
    <button class="enemy-slot" data-i="0"><span class="slot-q">?</span><span class="slot-hint">tap to pick</span></button>
    <button class="enemy-slot" data-i="1"><span class="slot-q">?</span><span class="slot-hint">tap to pick</span></button>
    <button class="enemy-slot" data-i="2"><span class="slot-q">?</span><span class="slot-hint">tap to pick</span></button>
  </div>
  <div id="result-wrap"></div>
</section>

<!-- ============ DETAIL OVERLAY ============ -->
<div id="detail-backdrop" class="hidden">
  <div id="detail-card">
    <div class="detail-hero">
      <img id="d-sprite" src="" alt="">
      <div class="d-name" id="d-name"></div>
      <div class="d-genus" id="d-genus"></div>
    </div>

    <div class="detail-tag">
      <img id="d-tag" src="" alt="">
      <div class="d-badges" id="d-badges"></div>
    </div>

    <div class="detail-body">
      <div class="d-pe" id="d-pe"></div>
      <div class="d-types" id="d-types"></div>

      <div class="d-matched">
        <div><b>Strong vs</b><div id="d-beats"></div></div>
        <div><b>Weak to</b><div id="d-weak"></div></div>
      </div>

      <div class="d-pokedex">
        <div class="d-sec-title">Pokédex</div>
        <div class="d-facts" id="d-facts"></div>
        <p class="d-flavor" id="d-flavor"></p>
        <div class="d-abilities" id="d-abilities"></div>
      </div>

      <button class="close-btn" id="detail-close">Close</button>
    </div>
  </div>
</div>

<!-- ============ ENEMY PICKER ============ -->
<div id="picker-backdrop" class="hidden">
  <div id="picker">
    <input id="picker-search" type="text" placeholder="Search Pokémon..." autocomplete="off">
    <div id="picker-list"></div>
  </div>
</div>

<!-- ============ NAV ============ -->
<nav id="nav">
  <button class="nav-btn active" data-view="grid"><span>📒</span>Collection</button>
  <button class="nav-btn" data-view="battle"><span>⚔️</span>Battle</button>
</nav>

<script src="app.js"></script>
</body>
</html>
